[package]
name = "nebula-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Engine data-plane transport from xlite (xlite#96). Off by default: the default build
# resolves no transport crate, and `NEBULA_UPSTREAM_TRANSPORT=xlite` fails at startup
# without it instead of silently falling back to reqwest.
xlite = ["dep:xlite-transport"]

[dependencies]
serde.workspace = true
bytes.workspace = true
http.workspace = true
async-trait.workspace = true
futures-util = "0.3"
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
axum.workspace = true
tokio.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
chrono.workspace = true
xtrace-client.workspace = true

# Pinned to an exact registry version (`=`), never a range: an A/B measured against
# 0.1.0 must keep measuring 0.1.0. `h1`-only is the Phase-1 configuration (cleartext
# HTTP/1.1 to vLLM/SGLang); it resolves without `rustls` at all, so a plaintext-only
# deployment carries no TLS stack. Bump deliberately and re-run the contract suite
# (`cargo test -p nebula-common --features xlite`, wired into ./scripts/ci.sh).
xlite-transport = { version = "=0.1.0", optional = true, default-features = false, features = ["h1"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# `start_paused` (virtual time) for the streaming-deadline tests
tokio = { version = "1", features = ["test-util"] }

