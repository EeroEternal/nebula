[package]
name = "nebula-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Engine data-plane transport from xlite (xlite#96). Off by default: the default build
# resolves no git dependency, and `NEBULA_UPSTREAM_TRANSPORT=xlite` fails at startup
# without it instead of silently falling back to reqwest.
xlite = ["dep:xlite-transport"]

[dependencies]
serde.workspace = true
bytes.workspace = true
http.workspace = true
async-trait.workspace = true
futures-util = "0.3"
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
axum.workspace = true
tokio.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
chrono.workspace = true
xtrace-client.workspace = true

# Pinned to a commit, never to a branch: a moving branch would change the numbers an A/B
# measured. `h1`-only is the Phase-1 configuration (cleartext HTTP/1.1 to vLLM/SGLang).
xlite-transport = { git = "https://github.com/EeroEternal/xlite", rev = "bb2ba1eac9a3b863b6e4c0531f5b5d0f3a5d2660", optional = true, default-features = false, features = ["h1", "tls-rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# `start_paused` (virtual time) for the streaming-deadline tests
tokio = { version = "1", features = ["test-util"] }

