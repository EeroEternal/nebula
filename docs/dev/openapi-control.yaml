openapi: 3.0.3
info:
  title: Nebula Control API
  description: |
    Machine-facing control routes on Gateway `:8081`.
    Stable contract: `/platform/v1/*` (I1).
    Stable contract: `/platform/v1/*` only (legacy `/v1/admin/*` removed in v1.6.0).
    See docs/dev/integration.md and docs/dev/integration-plan.md.
  version: 1.6.0

servers:
  - url: http://127.0.0.1:8081
    description: Gateway (default dev)

security:
  - bearerAuth: []

paths:
  /platform/v1/models:
    get:
      summary: List model specs
      operationId: platformListModels
      tags: [Platform v1]
      responses:
        '200':
          description: ModelSpec list
    post:
      summary: Create model spec
      operationId: platformCreateModel
      tags: [Platform v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '201':
          description: ModelSpec created

  /platform/v1/models/load:
    post:
      summary: Upsert spec and start deployment (compat-validated)
      operationId: platformLoadModel
      tags: [Platform v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelLoadRequest'
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'

  /platform/v1/models/{model_uid}:
    get:
      summary: Get model spec
      operationId: platformGetModel
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '200':
          description: ModelSpec

  /platform/v1/models/{model_uid}/deployment:
    get:
      summary: Get deployment desired state
      operationId: platformGetDeployment
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '200':
          description: ModelDeployment
    put:
      summary: Start or update deployment
      operationId: platformPutDeployment
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDeploymentRequest'
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'

  /platform/v1/models/{model_uid}/deployment/scale:
    post:
      summary: Scale deployment replicas
      operationId: platformScaleDeployment
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties:
                replicas:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Operation accepted

  /platform/v1/models/{model_uid}/stop:
    post:
      summary: Stop model deployment
      operationId: platformStopModel
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '202':
          description: Operation accepted

  /platform/v1/models/{model_uid}/replicas:
    get:
      summary: List runtime replicas
      operationId: platformListReplicas
      tags: [Platform v1]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '200':
          description: Replica inventory

  /platform/v1/nodes:
    get:
      summary: List cluster nodes
      operationId: platformListNodes
      tags: [Platform v1]
      responses:
        '200':
          description: Node inventory

  /platform/v1/operations/{operation_id}:
    get:
      summary: Get async operation status
      operationId: platformGetOperation
      tags: [Platform v1]
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operation with refreshed ready_replicas

  /platform/v1/operations/{operation_id}/events:
    get:
      summary: Operation status SSE stream
      operationId: platformOperationEvents
      tags: [Platform v1]
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream of operation updates

  /platform/v1/health/summary:
    get:
      summary: Control plane health summary
      operationId: platformHealthSummary
      tags: [Platform v1]
      responses:
        '200':
          description: gateway / etcd / router + cluster counts

  /platform/v1/audit-logs:
    get:
      summary: Audit log read (xtrace proxy)
      operationId: platformAuditLogs
      tags: [Platform v1]
      responses:
        '200':
          description: Audit traces from xtrace

  /platform/v1/models/{model_uid}/slo:
    get:
      summary: Model SLO definition
      operationId: platformGetSlo
      tags: [Platform v1 Governance]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '200':
          description: ModelSlo

  /platform/v1/models/{model_uid}/slo/evaluation:
    get:
      summary: Live SLO evaluation from Router metrics
      operationId: platformEvaluateSlo
      tags: [Platform v1 Governance]
      parameters:
        - $ref: '#/components/parameters/modelUid'
      responses:
        '200':
          description: SloEvaluation

  /platform/v1/canaries:
    get:
      summary: List canary releases
      operationId: platformListCanaries
      tags: [Platform v1 Governance]
      parameters:
        - name: model_uid
          in: query
          schema:
            type: string
      responses:
        '200':
          description: CanaryRelease list

  /platform/v1/canaries/{canary_id}:
    get:
      summary: Get canary release
      operationId: platformGetCanary
      tags: [Platform v1 Governance]
      parameters:
        - name: canary_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CanaryRelease

  /platform/v1/webhooks:
    get:
      summary: List webhook subscriptions
      operationId: platformListWebhooks
      tags: [Platform v1]
      responses:
        '200':
          description: WebhookSubscription list
    post:
      summary: Create webhook subscription
      operationId: platformCreateWebhook
      tags: [Platform v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: WebhookSubscription created

  /platform/v1/webhooks/{webhook_id}:
    delete:
      summary: Revoke webhook subscription
      operationId: platformDeleteWebhook
      tags: [Platform v1]
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked

  /platform/v1/cluster/status:
    get:
      summary: Cluster snapshot (nodes, endpoints, placements)
      operationId: platformClusterStatus
      tags: [Platform v1]
      responses:
        '200':
          description: ClusterStatus JSON

  /platform/v1/whoami:
    get:
      summary: Current auth principal
      operationId: platformWhoami
      tags: [Platform v1]
      responses:
        '200':
          description: principal, role, tenant_id

  /platform/v1/replicas/drain:
    post:
      summary: Mark replica endpoint as draining
      operationId: platformDrainReplica
      tags: [Platform v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_uid, replica_id]
              properties:
                model_uid:
                  type: string
                replica_id:
                  type: integer
      responses:
        '200':
          description: Drain accepted

  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat (inference)
      operationId: chatCompletions
      tags: [Inference]
      responses:
        '200':
          description: Completion response

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `NEBULA_AUTH_TOKENS` entry (`token:role[:tenant_id]`) or Postgres API key
        (`platform_api_keys`, scopes inference/control/admin).

  parameters:
    modelUid:
      name: model_uid
      in: path
      required: true
      schema:
        type: string

  schemas:
    CreateModelRequest:
      type: object
      required: [model_uid, model_name]
      properties:
        model_uid:
          type: string
        model_name:
          type: string
        engine_type:
          type: string
        docker_image:
          type: string
        config:
          type: object

    ModelLoadRequest:
      type: object
      required: [model_uid, model_name]
      properties:
        model_uid:
          type: string
        model_name:
          type: string
        replicas:
          type: integer
          default: 1
        node_id:
          type: string
        gpu_indices:
          type: array
          items:
            type: integer
        engine_type:
          type: string
        docker_image:
          type: string
        config:
          type: object

    StartDeploymentRequest:
      type: object
      properties:
        replicas:
          type: integer
        node_id:
          type: string
        gpu_indices:
          type: array
          items:
            type: integer
        replica_specs:
          type: array
          items:
            $ref: '#/components/schemas/ReplicaPlacementSpec'
        config_overrides:
          type: object
        callback_url:
          type: string
          format: uri
          description: HTTPS webhook for this Operation only

    ReplicaPlacementSpec:
      type: object
      properties:
        node_id:
          type: string
        gpu_indices:
          type: array
          items:
            type: integer
        config_overrides:
          type: object
        image_id:
          type: string

    CreateWebhookRequest:
      type: object
      required: [name, url, secret]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          minLength: 16

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        principal:
          type: string
        created_at_ms:
          type: integer

    OperationAccepted:
      type: object
      properties:
        operation_id:
          type: string
        model_uid:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed]

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            code:
              type: string
            message:
              type: string
            request_id:
              type: string

  responses:
    Error:
      description: C3-style error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
