    <text x="270" y="310" font-size="10" fill="#64748B">零RPC本地查表 · 计算迁向数据</text>

    <!-- Block B: Global Index & Joint Cost Scoring -->
    <rect x="380" y="234" width="188" height="98" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
