    <text x="882" y="274" font-size="10.5" fill="#1D4ED8" font-weight="600">Hint-Only &amp; Recompute</text>
    <text x="882" y="294" font-size="10" fill="#475569">缓存/网络异常退化本地Prefill</text>
    <text x="882" y="310" font-size="10" fill="#64748B">四项故障注入实测 100% 零拒绝</text>
