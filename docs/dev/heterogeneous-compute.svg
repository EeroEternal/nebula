    <circle cx="600" cy="417" r="4" fill="#10B981"/>
    <text x="610" y="421" font-size="12.5" font-weight="700" fill="#0F172A">三级缓存以存代算</text>
    <text x="598" y="441" font-size="10.5" fill="#475569">L0 HBM → L1 DDR5 → L2 NVMe</text>
    <text x="598" y="458" font-size="9.5" fill="#64748B">主机内存/磁盘放大10x容量 (Batch 6)</text>

    <!-- Hardware-Neutral lm:// & Tenant Isolation -->
