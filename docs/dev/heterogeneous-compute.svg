  <text x="576" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.06em">LAYER 4 · WORKLOAD DECOMPOSITION &amp; SUB-STAGE ABSTRACTION</text>

  <g filter="url(#shadow)">
    <!-- Card 1 -->
    <rect x="160" y="44" width="196" height="76" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="176" cy="65" r="4" fill="#3B82F6"/>
    <text x="186" y="69" font-size="12.5" font-weight="700" fill="#1E293B">纯前向打分计算</text>
    <text x="174" y="88" font-size="10.5" fill="#475569">EngineCapability.score_api</text>
