    <text x="386" y="104" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">Decode空闲时跳过远端查表</text>

    <!-- Card 3 -->
    <rect x="584" y="44" width="196" height="76" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="600" cy="65" r="4" fill="#3B82F6"/>
    <text x="610" y="69" font-size="12.5" font-weight="700" fill="#1E293B">挂起态计算续接</text>
    <text x="598" y="88" font-size="10.5" fill="#475569">Tool-Pause Continuation</text>
    <text x="598" y="104" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">单次租约优先唤醒 · 保住PLAS</text>

    <!-- Card 4 -->
    <rect x="796" y="44" width="196" height="76" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="812" cy="65" r="4" fill="#3B82F6"/>
    <text x="822" y="69" font-size="12.5" font-weight="700" fill="#1E293B">算子/验证级置换</text>
    <text x="810" y="88" font-size="10.5" fill="#475569">Speculative · ngram / mtp</text>
    <text x="810" y="104" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">廉价草稿置换大图串行权重访存</text>
