# Example Promtail scrape for Nebula JSON logs (Loki path).
# App writes JSON to stdout/files; Promtail ships to Loki — no app→Loki HTTP.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions-nebula.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nebula
    static_configs:
      - targets:
          - localhost
        labels:
          job: nebula
          __path__: /var/log/nebula/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: fields.request_id
            service: fields.service
            message: fields.message
      - labels:
          level:
          service:
