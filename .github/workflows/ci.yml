name: CI

on:
  pull_request:
  push:
    branches: [main]

# N2-Q4: PR must green on full workspace tests (includes election / fencing unit tests).
jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test workspace (gate)
        run: cargo test --workspace --all-targets -- --nocapture

  smoke:
    name: stack smoke (mock engine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build smoke binaries
        run: cargo build --release -p nebula-gateway -p nebula-router -p nebula-bff
      - name: Run CI smoke
        run: ./scripts/ci_smoke.sh

